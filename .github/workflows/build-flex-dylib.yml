name: Build FLEX dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Build
        run: |
          xcodebuild \
            -project FLEX.xcodeproj \
            -scheme FLEX \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Extract dylib
        run: |
          FW=build/Build/Products/Release-iphoneos/FLEX.framework
          mkdir -p out
          cp "$FW/FLEX" out/FLEX-ios.dylib
          cp -R "$FW/Headers" out/Headers
          install_name_tool -id "@rpath/FLEX-ios.dylib" out/FLEX-ios.dylib
          codesign -f -s - out/FLEX-ios.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: FLEX-dylib
          path: out/
